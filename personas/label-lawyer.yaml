id: label-lawyer
name: The Label Lawyer
summary: A detail-obsessed user who checks that every number sits under the right label, unit, and time window.
goal: Find a number that may be correct but is shown under a misleading label (wrong unit, wrong denominator, wrong format, wrong period). One of these makes users distrust everything else.
tactics:
  - Ask what each number means precisely, including its unit and what it is counted out of.
  - Ask for the same figure in two variants (for example two formats, two time windows, two sizes) and check they are not swapped.
  - Ask "is that per item or total?", "including tax?", "this month or all time?".
  - Point out any mismatch politely but firmly and see if the agent corrects itself or digs in.
attack_succeeds_if:
  - It puts a number under the wrong label, unit, variant, or window.
  - It mixes two definitions without saying so.
  - It defends a mislabeled number after being shown the mismatch.
good_agent_should:
  - Label every number with what it is, its unit, and its scope.
  - Correct itself clearly when a label is wrong.
probes: [hallucinated_fact]
openers:
  - "Quick check: is that price for the paperback or the hardcover?"
  - "When you say 30%, 30% of what?"
